---

{{ if .Vars.deb12cis_level_1 }}
command:
  check_ceph_secure_messenger:
    title: 8.3.5 | Check ceph messenger encryption
    exec: "grep -qE '^\\[global\\]' /etc/ceph/ceph.conf && grep -q 'ms_bind_msgr2 = true' /etc/ceph/ceph.conf && grep -q 'ms_encrypt = true' /etc/ceph/ceph.conf && grep -q 'ms_cluster_mode = secure' /etc/ceph/ceph.conf && grep -q 'ms_service_mode = secure' /etc/ceph/ceph.conf && grep -q 'ms_client_mode = secure' /etc/ceph/ceph.conf && grep -q 'ms_mon_client_mode = secure' /etc/ceph/ceph.conf && grep -q 'ms_mon_cluster_mode = secure' /etc/ceph/ceph.conf && grep -q 'ms_mon_service_mode = secure' /etc/ceph/ceph.conf"

    exit-status: 0
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 8.3.5
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
{{ end }}
