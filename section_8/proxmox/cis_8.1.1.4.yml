{{ if .Vars.deb12cis_level_1 }}
command:
  audit_ssh_hardening:
    title: "8.1.1.4"
    exec: "( grep -Eq '^HostKey\\s+/etc/ssh/ssh_host_ed25519_key' /etc/ssh/sshd_config && grep -Eq '^HostKey\\s+/etc/ssh/ssh_host_rsa_key' /etc/ssh/sshd_config && awk '$5<3071{exit 1}' /etc/ssh/moduli && grep -Eq 'KexAlgorithms|Ciphers|MACs|HostKeyAlgorithms|RequiredRSASize|CASignatureAlgorithms|GSSAPIKexAlgorithms|HostbasedAcceptedAlgorithms|PubkeyAcceptedAlgorithms' /etc/ssh/sshd_config.d/ssh-audit_hardening.conf ) && echo \"All SSH hardening requirements met.\" || echo \"One or more SSH hardening checks failed.\""
    exit-status: 0
    stdout:
    - '!/./'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 8.1.1.4
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
{{ end }}
