---

{{ if .Vars.deb12cis_level_1 }}
command:
  check_pbs_encrypt:
    title: 8.2.3.3 | Protect the GUI with Fail2Ban
    exec: "fail2ban-client status | grep -q 'proxmox' && fail2ban-client status | grep -q 'sshd' && echo 'OK' || echo 'KO'"
    exit-status: 0
    stdout:
    - '/^OK/'
    - '!/^KO/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 8.2.3.3
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
{{ end }}
