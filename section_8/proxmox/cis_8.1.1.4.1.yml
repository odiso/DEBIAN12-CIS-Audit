{{ if .Vars.deb12cis_level_1 }}
command:
  audit_ssh_hardening_2:
    title: "8.1.1.4.1 | Audit SSH hardening configuration for user"
    exec: "bash -c \"[ -d ~/.ssh ] && [ \\\"\\\$(stat -c '%a' ~/.ssh)\\\" = \\\"700\\\" ] && [ -f ~/.ssh/config ] && (for key in \\\"Ciphers\\\" \\\"KexAlgorithms\\\" \\\"MACs\\\" \\\"RequiredRSASize\\\" \\\"HostKeyAlgorithms\\\" \\\"CASignatureAlgorithms\\\" \\\"GSSAPIKexAlgorithms\\\" \\\"HostbasedAcceptedAlgorithms\\\" \\\"PubkeyAcceptedAlgorithms\\\"; do grep -q \\\"^[[:space:]]*\\\$key\\\" ~/.ssh/config || { echo \\\"Missing \\$key\\\"; exit 1; }; done) && echo \\\"SSH config OK\\\" || echo \\\"SSH config incomplete or wrong permissions\\\"\""
    exit-status: 0
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 8.1.1.4.1
      CISv8: 4.1
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - CM-1
      - CM-2
      - CM-6
      - CM-7
      - IA-5
{{ end }}
