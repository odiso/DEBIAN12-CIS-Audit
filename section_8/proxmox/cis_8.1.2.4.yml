---

{{ if .Vars.deb12cis_level_1 }}
command:
  check_corosync:
    title: 8.1.2.4 | Check firewall acticvation and ssh and web rule
    exec: "grep -q '^enable: 1' /etc/pve/firewall/cluster.fw && grep -q '^IN ACCEPT.*-dport 8006' /etc/pve/firewall/cluster.fw && grep -q '^IN SSH(ACCEPT)' /etc/pve/firewall/cluster.fw"
    exit-status: 0
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 8.1.2.4
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
{{ end }}
