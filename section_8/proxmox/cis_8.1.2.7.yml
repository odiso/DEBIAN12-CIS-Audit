---

{{ if .Vars.deb12cis_level_1 }}
command:
  check_lxc_presence:
    title: 8.1.2.7 | Avoid LXC - Run Container Platforms Inside VMs
    exec: "[ -f /etc/pve/lxc/*.conf ] && echo 'KO. at least 1 LXC container exist'"
    exit-status: 1
    stdout:
    - '!/^KO/'
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 8.1.2.7
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
{{ end }}
