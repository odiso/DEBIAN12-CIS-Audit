---

{{ if .Vars.deb12cis_level_1 }}
command:
  check_corosync:
    title: 8.3.2 | Secure Inter-Node Communication
    exec: corosync-cmapctl | grep -q "totem.secauth (str) = on"
    exit-status: 0
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 8.3.2
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
{{ end }}
