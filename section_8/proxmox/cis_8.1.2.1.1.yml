---

{{ if .Vars.deb12cis_level_1 }}
command:
  check_kernel_lockdown:
    title: 8.1.2.1.1 | Kernel Lockdown (Integrity Mode)
    exec: cat /sys/kernel/security/lockdown | grep -q '\[integrity\]'
    exit-status: 0
    meta:
      server: 1
      workstation: 1
      CIS_ID:
      - 8.1.2.1.1
      CISv8: 3.3
      CISv8_IG1: true
      CISv8_IG2: true
      CISv8_IG3: true
      NIST800-53R5:
      - AC-3
      - MP-2
{{ end }}
